<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#315f50">
  <title>Administrador · Lectores</title>
  <link rel="stylesheet" href="/private/styles.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lectores">
  <script src="/private/js/pwa.js" defer></script>
</head>
<body class="login-page">
  <main class="login-main">
    <section class="login-card">
      <a class="back-link" href="/">← Volver al modo lectura</a>
      <div class="login-mark">✦</div>
      <p class="eyebrow">ACCESO PROTEGIDO</p>
      <h1>Modo administrador</h1>
      <p class="login-copy">Ingresa la contraseña administrativa para editar lectores, misas y asignaciones.</p>
      <form id="loginForm" class="login-form">
        <label for="password">Contraseña</label>
        <div class="password-field">
          <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
          <button type="button" class="password-visibility" aria-label="Mostrar contraseña"></button>
        </div>
        <p id="loginError" class="login-error" role="alert" aria-live="polite"></p>
        <button class="primary" type="submit">Entrar como administrador</button>
      </form>
    </section>
  </main>
  <script src="/private/js/password-toggle.js"></script>
  <script src="/private/js/login.js"></script>
</body>
</html>
